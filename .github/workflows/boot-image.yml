name: Boot image

# docs/998-roadmap.md M0/M1: the boot image is a separate build system (Buildroot), not a cargo
# workspace member, so it gets its own workflow rather than folding into ci.yml's `test`/`lint`
# jobs. A from-scratch Buildroot build is much slower than the pure-Rust jobs, so this runs only
# when something that actually lands in the image changes.
#
# These jobs previously lived in ci.yml behind
# `if: contains(github.event.head_commit.modified, 'boot/')`, which never once evaluated true:
# `head_commit.modified` is an *array* of full file paths, and `contains(array, x)` tests for an
# element equal to `x`, not a substring of one -- no element is ever the literal string `boot/`.
# (`head_commit` doesn't exist on `pull_request` events at all, so pull requests never ran them
# either.) Workflow-level `paths:` filters are the native mechanism for this and can't be
# silently wrong in the same way.
#
# The two `paths:` lists below are duplicated rather than shared: GitHub Actions does not support
# YAML anchors/aliases in workflow files, so keep them in sync by hand.
on:
  push:
    branches: [main]
    paths:
      - "boot/**"
      # Anything in the workspace can end up in the image: `boot/` cross-compiles hyperion-init
      # and hyperion-console into the rootfs, and those pull in most of the other crates.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/boot-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "boot/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/boot-image.yml"
  # Lets a maintainer force a full image build (e.g. to re-validate after a Buildroot or toolchain
  # bump) without an unrelated code change.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Deliberately *not* `cancel-in-progress: true`, unlike every other workflow here.
#
# Cancelling is right for a fast job: the newest commit is what matters and an hour of stale
# results isn't worth the runner minutes. It is wrong for this one, for two reasons that only
# showed up once these jobs started running. A from-scratch Buildroot build takes the better part
# of an hour, so an active afternoon cancels every run before it produces anything -- five in a row
# on the day this was written. And `actions/cache` only saves in a job's post-step, which a
# cancelled job never reaches: so the Buildroot cache that would make the *next* run cheap never
# gets written, and every run pays the full cost forever.
#
# Queuing instead means each push's image really does get built and boot-tested, and the first
# completed run seeds a cache that makes the rest fast. This is the only end-to-end proof the
# operating system still boots; a result an hour late beats no result at all.
concurrency:
  group: boot-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  x86_64:
    name: x86_64 (QEMU + OVMF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install qemu + OVMF + Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf \
            build-essential bc cpio rsync unzip file libncurses-dev
      - name: Cache Buildroot download + build output
        uses: actions/cache@v4
        with:
          path: boot/.tools
          key: buildroot-x86_64-${{ hashFiles('boot/scripts/fetch-buildroot.sh', 'boot/board/hyperion-x86_64/**', 'boot/configs/hyperion_x86_64_efi_defconfig') }}
      - run: boot/scripts/build-image.sh
      - run: boot/scripts/boot-test.sh
        env:
          BOOT_TEST_TIMEOUT: "300"
      # docs/998-roadmap.md M6: re-validates hyperion-storage's crash-consistency-by-replay
      # guarantee against a real power-loss simulation (a real, dedicated block device, hard-
      # killed mid-write), not just the existing host-tempfile fault-injection tests.
      - run: boot/scripts/storage-crash-test.sh
        env:
          STORAGE_TEST_TIMEOUT: "300"
      # docs/998-roadmap.md M7 stage 1: a real utterance typed at the real booted console
      # (over a real Unix-socket serial port, not just boot-test.sh's output-only log capture)
      # produces a real Intent Graph, a real Agent invocation, and real rendered text -- proven
      # for both the one real HTN-decomposed utterance shape and the undecomposed fallback path.
      - run: boot/scripts/console-test.sh "" "I need to launch my startup" "market_research"
        env:
          CONSOLE_TEST_TIMEOUT: "300"
      - run: boot/scripts/console-test.sh "" "what is the weather like today" "generic_goal"
        env:
          CONSOLE_TEST_TIMEOUT: "300"

  # docs/998-roadmap.md M11: Hyperion's second reference platform. A separate job (not a matrix
  # leg of x86_64 above) because it needs its own cross-toolchain and its own Buildroot output
  # directory (see build-image-aarch64.sh's own comment on why output/ and output-aarch64/ can't
  # be shared) -- catching an aarch64-only regression here rather than only at release time.
  aarch64:
    name: aarch64 (QEMU, direct kernel boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install qemu + Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm \
            build-essential bc cpio rsync unzip file libncurses-dev
      - name: Cache Buildroot download + build output
        uses: actions/cache@v4
        with:
          path: boot/.tools
          key: buildroot-aarch64-${{ hashFiles('boot/scripts/fetch-buildroot.sh', 'boot/board/hyperion-aarch64/**', 'boot/configs/hyperion_aarch64_virt_defconfig') }}
      - run: boot/scripts/build-image-aarch64.sh
      - run: boot/scripts/boot-test-aarch64.sh
        env:
          BOOT_TEST_TIMEOUT: "300"
