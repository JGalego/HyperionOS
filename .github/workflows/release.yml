name: Release

# docs/998-roadmap.md M13: builds both reference-platform images from scratch, boot-tests
# each the same way ci.yml does on every push, signs both with this project's real Ed25519
# release-signing identity (a real device key, generated once with
# hyperion-release-gate's gen-signing-key bin and stored as the HYPERION_RELEASE_SIGNING_KEY
# repo secret -- never committed to the repo itself), and publishes the signed images plus their
# manifests as downloadable GitHub Release assets. Never runs against an untested image: both
# build jobs must pass their own boot-test before the publish job can sign or upload anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the release manifests and the created tag"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86_64:
    name: build + boot-test x86_64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install qemu + OVMF + Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf \
            build-essential bc cpio rsync unzip file libncurses-dev
      - name: Cache Buildroot download + build output
        uses: actions/cache@v4
        with:
          path: boot/.tools
          key: buildroot-x86_64-${{ hashFiles('boot/scripts/fetch-buildroot.sh', 'boot/board/hyperion-x86_64/**', 'boot/configs/hyperion_x86_64_efi_defconfig') }}
      - run: boot/scripts/build-image.sh
      - run: boot/scripts/boot-test.sh
        env:
          BOOT_TEST_TIMEOUT: "300"
      - name: Upload built x86_64 image
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-x86_64-image
          path: boot/.tools/buildroot-2026.05/output/images/disk.img
          retention-days: 1

  build-aarch64:
    name: build + boot-test aarch64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install qemu + Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm \
            build-essential bc cpio rsync unzip file libncurses-dev
      - name: Cache Buildroot download + build output
        uses: actions/cache@v4
        with:
          path: boot/.tools
          key: buildroot-aarch64-${{ hashFiles('boot/scripts/fetch-buildroot.sh', 'boot/board/hyperion-aarch64/**', 'boot/configs/hyperion_aarch64_virt_defconfig') }}
      - run: boot/scripts/build-image-aarch64.sh
      - run: boot/scripts/boot-test-aarch64.sh
        env:
          BOOT_TEST_TIMEOUT: "300"
      - name: Upload built aarch64 image
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-aarch64-image
          path: |
            boot/.tools/buildroot-2026.05/output-aarch64/images/Image
            boot/.tools/buildroot-2026.05/output-aarch64/images/rootfs.ext2
          retention-days: 1

  build-console:
    # Downloading a disk image and flashing a USB stick is a lot to ask of someone who just wants
    # to try Hyperion. `hyperion-console` is the same real Intent Engine, Agent dispatch, and
    # Knowledge Graph the booted image runs, as an ordinary binary -- so releases ship it too,
    # signed with the same identity the images are.
    #
    # Built with every optional feature that doesn't require downloading a model: real HTTP/TLS,
    # the three cloud providers, and mDNS. Local-first inference still works out of the box
    # through a local OpenAI-compatible engine (Ollama, vLLM, LiteLLM) -- in-process Candle is a
    # `--features candle` source build, since it pulls a heavy dependency tree for a path that
    # needs a downloaded model anyway. README.md says so where someone would look.
    name: build console (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p hyperion-console --bin hyperion-console
          --features real-http,openai-compat,anthropic,gemini,mdns
      # A binary that can't answer one utterance isn't worth signing. Runs the real thing against
      # the mock backend -- no network, no key, no model.
      - name: Smoke-test the built binary
        run: |
          printf '/backend mock\nhello there\n' > /tmp/smoke.txt
          OUT=$(HYPERION_CONSOLE_DATA_DIR=$(mktemp -d) \
            ./target/${{ matrix.target }}/release/hyperion-console /tmp/smoke.txt)
          echo "$OUT"
          echo "$OUT" | grep -q "echo: hello there"
      - name: Stage
        run: |
          mkdir -p console-staging
          cp "target/${{ matrix.target }}/release/hyperion-console" \
             "console-staging/hyperion-console-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hyperion-console-${{ matrix.target }}
          path: console-staging/hyperion-console-${{ matrix.target }}
          retention-days: 1

  publish:
    name: sign + publish release
    needs: [build-x86_64, build-aarch64, build-console]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: hyperion-x86_64-image
          path: release-staging/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: hyperion-aarch64-image
          path: release-staging/aarch64
      - uses: actions/download-artifact@v4
        with:
          pattern: hyperion-console-*
          merge-multiple: true
          path: release-staging/console
      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag-push trigger: GITHUB_REF_NAME is already the exact pushed tag (e.g. "v1.2.0").
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the real release-signing keystore from its repo secret
        env:
          HYPERION_RELEASE_SIGNING_KEY: ${{ secrets.HYPERION_RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p boot/.tools/release-keystore
          echo "$HYPERION_RELEASE_SIGNING_KEY" | base64 -d > boot/.tools/release-keystore/device.key
      - name: Sign each image
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cargo run --release -p hyperion-release-gate --bin sign-release -- \
            release-staging/x86_64/disk.img boot/.tools/release-keystore/device.key "$VERSION" x86_64
          cargo run --release -p hyperion-release-gate --bin sign-release -- \
            release-staging/aarch64/Image boot/.tools/release-keystore/device.key "$VERSION" aarch64-kernel
          cargo run --release -p hyperion-release-gate --bin sign-release -- \
            release-staging/aarch64/rootfs.ext2 boot/.tools/release-keystore/device.key "$VERSION" aarch64-rootfs
          for binary in release-staging/console/hyperion-console-*; do
            if [[ "$binary" == *.release.json ]]; then continue; fi
            cargo run --release -p hyperion-release-gate --bin sign-release -- \
              "$binary" boot/.tools/release-keystore/device.key "$VERSION" "$(basename "$binary")"
          done
      - name: Verify each signature before publishing anything
        run: |
          cargo run --release -p hyperion-release-gate --bin verify-release -- \
            release-staging/x86_64/disk.img release-staging/x86_64/disk.img.release.json
          cargo run --release -p hyperion-release-gate --bin verify-release -- \
            release-staging/aarch64/Image release-staging/aarch64/Image.release.json
          cargo run --release -p hyperion-release-gate --bin verify-release -- \
            release-staging/aarch64/rootfs.ext2 release-staging/aarch64/rootfs.ext2.release.json
          for binary in release-staging/console/hyperion-console-*; do
            if [[ "$binary" == *.release.json ]]; then continue; fi
            cargo run --release -p hyperion-release-gate --bin verify-release -- \
              "$binary" "$binary.release.json"
          done
      - name: Rename staged assets to their published release names
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p release-assets
          mv release-staging/x86_64/disk.img "release-assets/hyperion-x86_64-$VERSION.img"
          mv release-staging/x86_64/disk.img.release.json "release-assets/hyperion-x86_64-$VERSION.img.release.json"
          mv release-staging/aarch64/Image "release-assets/hyperion-aarch64-$VERSION-Image"
          mv release-staging/aarch64/Image.release.json "release-assets/hyperion-aarch64-$VERSION-Image.release.json"
          mv release-staging/aarch64/rootfs.ext2 "release-assets/hyperion-aarch64-$VERSION-rootfs.ext2"
          mv release-staging/aarch64/rootfs.ext2.release.json "release-assets/hyperion-aarch64-$VERSION-rootfs.ext2.release.json"
          # Version-stamped the same way the images are, so a downloaded binary says what it is.
          for binary in release-staging/console/hyperion-console-*; do
            if [[ "$binary" == *.release.json ]]; then continue; fi
            name="$(basename "$binary")"
            mv "$binary" "release-assets/${name/hyperion-console-/hyperion-console-$VERSION-}"
            mv "$binary.release.json" \
               "release-assets/${name/hyperion-console-/hyperion-console-$VERSION-}.release.json"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "Hyperion $VERSION" \
            --generate-notes \
            release-assets/*
