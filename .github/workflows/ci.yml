name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# A newer push to the same branch should win over an older one still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The workspace is a hosted simulator targeting Linux/macOS userspace
        # (see CLAUDE.md) — no bare-metal or Windows target yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # hyperion-trust-boundary/tests/enforcement.rs and hyperion-supervisor/tests/real_supervision.rs
          # (both Linux-only, both #[cfg(target_os = "linux")]-gated) each build a real, statically
          # linked musl probe/service binary at test time to run under real Landlock/seccomp
          # enforcement -- needs this target installed, same as the boot-image workflow already
          # does. Meaningless on macOS (those test files don't even compile there), so only added
          # for the ubuntu leg of this matrix.
          targets: ${{ matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-musl' || '' }}
      - uses: Swatinem/rust-cache@v2
      # `--locked` throughout: without it CI silently resolves newer semver-compatible dependency
      # versions than the committed Cargo.lock, so a green run does not prove the lockfile every
      # contributor and every release build actually uses is green.
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  lint:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

