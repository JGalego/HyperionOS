name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# A newer push to the same branch should win over an older one still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The workspace is a hosted simulator targeting Linux/macOS userspace
        # (see CLAUDE.md) — no bare-metal or Windows target yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # hyperion-trust-boundary/tests/enforcement.rs and hyperion-supervisor/tests/real_supervision.rs
          # (both Linux-only, both #[cfg(target_os = "linux")]-gated) each build a real, statically
          # linked musl probe/service binary at test time to run under real Landlock/seccomp
          # enforcement -- needs this target installed, same as the boot-image workflow already
          # does. Meaningless on macOS (those test files don't even compile there), so only added
          # for the ubuntu leg of this matrix.
          targets: ${{ matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-musl' || '' }}
      - uses: Swatinem/rust-cache@v2
      # `--locked` throughout: without it CI silently resolves newer semver-compatible dependency
      # versions than the committed Cargo.lock, so a green run does not prove the lockfile every
      # contributor and every release build actually uses is green.
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  lint:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  claims:
    name: claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The trust-boundary claims spawn a real sandboxed musl binary; see the `test` job.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # Verifies every claim in claims.toml still names a test that exists, then runs those tests.
      # The `test` job already runs all of them -- what this adds is the mapping: rename or delete
      # a test that a stated guarantee depends on, and CI says which guarantee just lost its
      # evidence, instead of the prose quietly outliving the proof. See claims.toml's own header.
      - run: scripts/check-claims.py

  features:
    name: optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `cargo test --workspace` builds default features only, so everything behind an optional
      # feature -- the real HTTP/TLS fetch stack, the robots.txt and microformats parsers, the
      # three cloud backends, mDNS discovery -- was never compiled, let alone run, by any job here.
      # Tests written behind those gates simply never executed; one of them had been failing
      # unnoticed.
      #
      # These four are cheap enough to actually run. `candle` is deliberately excluded: its
      # dependency tree (candle-core/nn/transformers, tokenizers, hf-hub) costs several minutes to
      # build for a code path whose own tests need a downloaded model anyway. That leaves a real,
      # named gap rather than a silent one.
      - run: >-
          cargo test --locked
          -p hyperion-console -p hyperion-netstack -p hyperion-ai-runtime
          --features hyperion-console/real-http,hyperion-console/openai-compat,hyperion-console/anthropic,hyperion-console/gemini,hyperion-console/mdns
      - run: >-
          cargo clippy --locked --all-targets
          -p hyperion-console -p hyperion-netstack -p hyperion-ai-runtime
          --features hyperion-console/real-http,hyperion-console/openai-compat,hyperion-console/anthropic,hyperion-console/gemini,hyperion-console/mdns
          -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every public component here documents its purpose, inputs, outputs, failure modes, and
      # security implications (CLAUDE.md's own Definition of Done), and those doc comments lean
      # heavily on intra-doc links to each other. A link resolving to nothing is a silently dead
      # cross-reference, and 58 of them had accumulated unnoticed because nothing ever built the
      # docs.
      #
      # `private_intra_doc_links` is deliberately allowed. This workspace's doc comments routinely
      # name the internal helper that implements a behaviour (`Self::prepare_dispatches`,
      # `crate::quarantine::scan`) because the audience for them is someone reading the source.
      # That is how this codebase documents itself, not a defect to lint away.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -A rustdoc::private_intra_doc_links"

