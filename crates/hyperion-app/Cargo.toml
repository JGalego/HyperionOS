[package]
name = "hyperion-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Apps Hyperion builds for a goal: a typed input contract that rides inside the signed capability manifest, and real build/list/describe/run/remove over the existing Plugin Registry (docs/998-roadmap.md, App Builder M1)."

[dependencies]
hyperion-capability = { workspace = true }
hyperion-crypto = { workspace = true }
# An app's owner is a real principal name, validated the same way every other principal name is
# rather than by a second copy of the same rules (docs/998-roadmap.md §0, Decision 2).
hyperion-identity = { workspace = true }
# An app declares a real Scheduler admission budget rather than leaving `resource_profile` unset,
# which made every app fall back to a stand-in describing a model call.
hyperion-scheduler = { workspace = true }
# App Builder T3: a resident app is a supervised service, so supervision comes from the crate that
# already solves it rather than a second restart policy kept in agreement with the first.
hyperion-supervisor = { workspace = true }
hyperion-trust-boundary = { workspace = true }
hyperion-plugin-framework = { workspace = true }
hyperion-sdk = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The contract encoding is hand-rolled escaping over three delimiters, round-tripped through a
# signed manifest -- exactly the shape example-based tests under-cover. The same reasoning
# `hyperion-capability` already applies to its own invariants.
proptest = { workspace = true }
tempfile = { workspace = true }
